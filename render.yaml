services:
  - type: web
    name: routeshield
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && cd apps/web && npm install && npm run build && cd ../.. && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn apps.api.config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ROUTING_PROVIDER
        value: "osrm"
      - key: WEATHER_PROVIDER
        value: "openmeteo"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
